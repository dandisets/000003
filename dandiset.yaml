dateCreated: '2020-03-15T22:56:55.655000+00:00'
description: "Silicon probe recordings from the dentate gyrus and CA3 of 16 freely
  moving mice (101 sessions), from Senzai and Buzsaki (2017), \"Physiological Properties
  and Behavioral Correlates of Hippocampal Granule Cells and Mossy Cells\", Neuron
  93, 691-704. Each file is one recording session: the sorted units with the lab's
  cell types and spike waveforms, the LFP, brain states, dentate spikes, light pulses
  for optogenetic tagging, the lab's tables of monosynaptic connections and synchronous
  pairs, and positions and trials on the circular T-maze and in open fields.\n\nFifteen
  of the mice are in the paper's Table S1. YutaMouse57 (8 sessions, 465 units) is
  not part of the paper: it is not in Table S1 and its units are not in the paper's
  counts. The paper's sixteenth mouse, YM21, recorded with a 32-site linear probe
  for the depth profile of dentate spikes (Figure 1B), is not in this dandiset."
